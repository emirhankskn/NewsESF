name: Haberleri topla ve yayınla

on:
  schedule:
    # Her 30 dakikada bir (GitHub bazen birkaç dakika geciktirebilir).
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Aynı anda iki çalışma olmasın; biri bitince diğeri başlasın.
concurrency:
  group: newsesf
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toplayici/requirements.txt

      - run: pip install -r toplayici/requirements.txt

      - name: Pages ayarlarını al
        id: pages
        uses: actions/configure-pages@v5

      - name: Haberleri topla
        env:
          # Geçmiş haberler, yayındaki sitenin kendi verisinden okunur.
          ONCEKI_VERI_URL: ${{ steps.pages.outputs.base_url }}/veri/haberler.json
        run: python toplayici/topla.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Siteyi yayınla
        id: yayin
        uses: actions/deploy-pages@v4

      # aboneler.txt'deki cihazlara, bu çalışmada gelen yeni haberler için push bildirimi gönderir.
      - name: Bildirimleri gönder
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SITE_ADRESI: ${{ steps.pages.outputs.base_url }}
        run: python toplayici/bildir.py

      # GitHub, 60 gün commit almayan public repolarda zamanlanmış işleri durdurur.
      # Son commit 45 günden eskiyse küçük bir commit atarak zamanlayıcıyı canlı tutar.
      - name: Zamanlayıcıyı canlı tut
        if: github.event_name == 'schedule'
        run: |
          son=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - son )) -gt $(( 45 * 24 * 3600 )) ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/canli-tut.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/canli-tut.txt
            git commit -m "Zamanlayıcıyı canlı tut"
            git push
          fi
